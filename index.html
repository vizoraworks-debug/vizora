<button type="button" onclick="openUploadForm()">
  UPLOAD A PROJECT
</button>
<!-- VIZORA PROJECT UPLOAD -->
<div id="uploadModal" class="upload-modal">
  <div class="upload-box">

    <button class="close-upload" onclick="closeUploadForm()">×</button>

    <div class="upload-brand">VIZORA</div>

    <h2>PROJECT SUBMISSION</h2>
    <p class="upload-subtitle">
      Tell us about your project and upload your files.
    </p>

    <form id="projectForm">

      <label>Your Name *</label>
      <input
        id="clientName"
        type="text"
        placeholder="Enter your name"
        required
      >

      <label>Email *</label>
      <input
        id="clientEmail"
        type="email"
        placeholder="your@email.com"
        required
      >

      <label>WhatsApp Number</label>
      <input
        id="clientPhone"
        type="tel"
        placeholder="+91 XXXXX XXXXX"
      >

      <label>Project Type</label>
      <select id="projectType">
        <option value="Video Editing">Video Editing</option>
        <option value="Reel Editing">Reel Editing</option>
        <option value="Color Grading">Color Grading</option>
        <option value="Sound Design">Sound Design</option>
        <option value="Other">Other</option>
      </select>

      <label>Project Details</label>
      <textarea
        id="description"
        placeholder="Tell us what you need..."
        rows="5"
      ></textarea>

      <label>Upload Your File *</label>

      <input
        id="projectFile"
        type="file"
        accept="image/*,video/*,.pdf,.zip,.rar"
        required
      >

      <div id="uploadStatus"></div>

      <button class="submit-project" type="submit">
        SUBMIT PROJECT
      </button>

    </form>
  </div>
</div>

<style>
.upload-modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 99999;
  background: rgba(0,0,0,.88);
  overflow-y: auto;
  padding: 30px 18px;
}

.upload-modal.active {
  display: flex;
  align-items: flex-start;
  justify-content: center;
}

.upload-box {
  width: 100%;
  max-width: 620px;
  margin: 20px auto;
  padding: 30px 24px;
  background: #090909;
  border: 1px solid #b98a32;
  border-radius: 18px;
  position: relative;
  box-shadow: 0 20px 80px rgba(0,0,0,.7);
}

.close-upload {
  position: absolute;
  right: 18px;
  top: 14px;
  background: transparent;
  border: 0;
  color: #fff;
  font-size: 32px;
  cursor: pointer;
}

.upload-brand {
  color: #e9ad35;
  font-size: 18px;
  font-weight: 800;
  letter-spacing: 8px;
  margin-bottom: 18px;
}

.upload-box h2 {
  color: #fff;
  font-size: 30px;
  margin: 0 0 8px;
}

.upload-subtitle {
  color: #999;
  margin-bottom: 28px;
}

.upload-box label {
  display: block;
  color: #ddd;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 1px;
  margin: 18px 0 8px;
}

.upload-box input,
.upload-box select,
.upload-box textarea {
  width: 100%;
  box-sizing: border-box;
  background: #111;
  border: 1px solid #333;
  color: #fff;
  border-radius: 10px;
  padding: 14px;
  font-size: 15px;
  outline: none;
}

.upload-box textarea {
  resize: vertical;
}

.upload-box input:focus,
.upload-box select:focus,
.upload-box textarea:focus {
  border-color: #e9ad35;
}

.submit-project {
  width: 100%;
  margin-top: 25px;
  padding: 17px;
  border: 0;
  border-radius: 10px;
  background: linear-gradient(135deg,#ffd05a,#e89c18);
  color: #090909;
  font-weight: 900;
  letter-spacing: 1px;
  cursor: pointer;
}

#uploadStatus {
  margin-top: 15px;
  color: #e9ad35;
  text-align: center;
  font-weight: 700;
}
</style>

<script>
const SUPABASE_URL =
  "https://veuazvrtrginvucylnsf.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_PKVhV-YrnZgLBg4BFm2GLA_O-wkDJBl";

function openUploadForm() {
  document.getElementById("uploadModal").classList.add("active");
}

function closeUploadForm() {
  document.getElementById("uploadModal").classList.remove("active");
}

document
  .getElementById("projectForm")
  .addEventListener("submit", async function(e) {

    e.preventDefault();

    const status = document.getElementById("uploadStatus");
    const file = document.getElementById("projectFile").files[0];

    if (!file) {
      status.textContent = "Please select a file.";
      return;
    }

    status.textContent = "Uploading your project...";

    try {

      const safeName = file.name
        .replace(/[^a-zA-Z0-9._-]/g, "_");

      const filePath =
        Date.now() + "_" + safeName;

      /* Upload file */

      const uploadResponse = await fetch(
        SUPABASE_URL +
        "/storage/v1/object/project-uploads/" +
        encodeURIComponent(filePath),
        {
          method: "POST",
          headers: {
            "Authorization":
              "Bearer " + SUPABASE_KEY,
            "apikey": SUPABASE_KEY,
            "Content-Type": file.type ||
              "application/octet-stream"
          },
          body: file
        }
      );

      if (!uploadResponse.ok) {
        const errorText =
          await uploadResponse.text();

        throw new Error(errorText);
      }

      const fileUrl =
        SUPABASE_URL +
        "/storage/v1/object/public/project-uploads/" +
        encodeURIComponent(filePath);

      /* Save project information */

      const projectData = {
        client_name:
          document.getElementById("clientName").value,

        email:
          document.getElementById("clientEmail").value,

        phone:
          document.getElementById("clientPhone").value,

        project_type:
          document.getElementById("projectType").value,

        description:
          document.getElementById("description").value,

        file_url: fileUrl,

        file_name: file.name
      };

      const databaseResponse = await fetch(
        SUPABASE_URL +
        "/rest/v1/project_submissions",
        {
          method: "POST",
          headers: {
            "Authorization":
              "Bearer " + SUPABASE_KEY,
            "apikey": SUPABASE_KEY,
            "Content-Type": "application/json",
            "Prefer": "return=minimal"
          },
          body: JSON.stringify(projectData)
        }
      );

      if (!databaseResponse.ok) {
        const errorText =
          await databaseResponse.text();

        throw new Error(errorText);
      }

      status.textContent =
        "✓ Project submitted successfully!";

      document.getElementById("projectForm").reset();

    } catch (error) {

      console.error(error);

      status.textContent =
        "Upload failed. Please try again.";
    }
  });
</script>
